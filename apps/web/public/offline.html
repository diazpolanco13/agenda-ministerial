<!doctype html>
<html lang="es-VE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1E3A5F" />
    <title>Sin conexión a la red · AGENDA MPPD</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f5f0;
        --surface: #ffffff;
        --border: #dcdcd2;
        --navy: #1e3a5f;
        --navy-hover: #162c49;
        --text: #1c2430;
        --muted: #525d6b;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background-color: var(--bg);
        color: var(--text);
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      main {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        width: 100%;
        max-width: 460px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-top: 4px solid var(--navy);
        border-radius: 12px;
        padding: 32px 28px;
        text-align: center;
        box-shadow: 0 8px 24px rgba(30, 58, 95, 0.08);
      }

      .emblem-wrap {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
      }

      .emblem {
        width: 72px;
        height: auto;
        display: block;
      }

      .emblem-fallback {
        display: none;
        padding: 10px 16px;
        border-radius: 8px;
        background: var(--navy);
        color: #ffffff;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .eyebrow {
        margin: 0 0 8px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--navy);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 22px;
        line-height: 1.25;
        font-weight: 700;
        color: var(--text);
      }

      p {
        margin: 0 0 24px;
        font-size: 14px;
        line-height: 1.6;
        color: var(--muted);
      }

      button {
        appearance: none;
        border: none;
        border-radius: 8px;
        background-color: var(--navy);
        color: #ffffff;
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        padding: 11px 22px;
        cursor: pointer;
        transition: background-color 150ms ease;
      }

      button:hover {
        background-color: var(--navy-hover);
      }

      button:focus-visible {
        outline: 2px solid var(--navy);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-labelledby="offline-title">
        <div class="emblem-wrap">
          <img
            src="/marca/mppd.png"
            alt="Escudo del Ministerio del Poder Popular para la Defensa"
            class="emblem"
            onerror="
              this.style.display = 'none';
              this.nextElementSibling.style.display = 'inline-block';
            "
          />
          <span class="emblem-fallback" aria-hidden="true">AGENDA · MPPD</span>
        </div>
        <p class="eyebrow">AGENDA · MPPD</p>
        <h1 id="offline-title">Sin conexión a la red</h1>
        <p>
          AGENDA requiere conexión con el servidor ministerial para sincronizar
          órdenes y tareas. Verifica tu red y vuelve a intentarlo.
        </p>
        <button type="button" onclick="window.location.reload()">
          Reintentar
        </button>
      </section>
    </main>
  </body>
</html>
