<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>AGENDA · MPPD</title>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="googlebot" content="noindex, nofollow, noarchive" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#1E3A5F" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="title" content="AGENDA · MPPD" />
  <meta name="description"
    content="Sistema de Gestión de Agenda Ministerial, Reuniones, Acuerdos y Tareas — Ministerio del Poder Popular para la Defensa." />
  <meta name="application-name" content="AGENDA" />
  <meta name="apple-mobile-web-app-title" content="AGENDA" />

  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="shortcut icon" href="/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function () {
      try {
        var factors = { normal: 1.0625, large: 1.125, xlarge: 1.25, xxlarge: 1.375 };
        var raw = window.localStorage.getItem("agenda-accessibility");
        var prefs = raw ? JSON.parse(raw) : null;
        var scaleKey = prefs && factors[prefs.fontScale] ? prefs.fontScale : "normal";
        var root = document.documentElement;
        root.style.setProperty("--agenda-font-scale", String(factors[scaleKey]));
        root.dataset.fontScale = scaleKey;
        if (prefs && prefs.highContrast) root.classList.add("high-contrast");
        var rm = prefs && prefs.reduceMotion ? prefs.reduceMotion : "system";
        var sysReduce =
          typeof window.matchMedia === "function" &&
          window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (rm === "always" || (rm === "system" && sysReduce)) {
          root.classList.add("reduce-motion");
        }
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
